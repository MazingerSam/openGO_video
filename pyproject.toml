[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opengovideo"
version = "0.1.0"
description = "openGO_video：本機 Agent 遙控 Google Colab GPU 的開源影片生成工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
server = [
    "diffusers>=0.31.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pycloudflared>=0.2.2",
]

[project.scripts]
opengovideo = "opengovideo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
